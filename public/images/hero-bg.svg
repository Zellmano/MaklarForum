<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" preserveAspectRatio="xMidYMid slice">
  <!-- Hero background placeholder. Swap this file for a real photo
       (keep the same name, or point --hero-bg-image in globals.css to your file). -->
  <defs>
    <filter id="softhero" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="110" />
    </filter>
  </defs>
  <rect width="1440" height="640" fill="#fdfbf6" />
  <g filter="url(#softhero)" opacity="0.85">
    <circle cx="180" cy="160" r="260" fill="#0f766e" />
    <circle cx="1180" cy="120" r="230" fill="#b88a2c" />
    <circle cx="1000" cy="560" r="280" fill="#13836f" />
    <circle cx="420" cy="600" r="220" fill="#e9cd86" />
    <circle cx="700" cy="320" r="200" fill="#cfe3c2" />
  </g>
</svg>
